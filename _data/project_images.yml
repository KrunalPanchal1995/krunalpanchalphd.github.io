mosiac:
- index: 1
  caption: Ignitability map (3D)
  topic: h2o2-validation
  description: A 3D scatter of ignitable vs. non-ignitable points across temperature, pressure and equivalence ratio (0.3-6, step 0.3, 10s ignition-time bound). The small clustered region on the surface is the entire condition range a reference NeuralODE was trained on — the coloured field around it is everywhere this sweep additionally tests.
  src_800: assets/img/projects/mosiac/01_02b_ignitability_3d_map-800.png
- index: 2
  caption: Stiffness map across conditions
  topic: h2o2-validation
  description: Chemical stiffness ratio (log scale, colour-mapped) across the same temperature/pressure/equivalence-ratio grid as the ignitability map — showing how numerically stiff the kinetics get far outside the small region a reference NeuralODE was trained on.
  src_800: assets/img/projects/mosiac/02_02c_stiffness_3d_map-800.png
  src_1600: assets/img/projects/mosiac/02_02c_stiffness_3d_map-1600.png
- index: 3
  caption: Ignition-delay grid, Ar dilution
  topic: h2o2-validation
  description: Ignition-delay time vs. 1000/T at three pressures (0.1, ~3.2, 100 atm) with argon dilution, each panel overlaying multiple equivalence ratios — the classic Arrhenius-plot validation view for autoignition chemistry.
  src_800: assets/img/projects/mosiac/03_03_idt_grid_AR-800.png
  src_1600: assets/img/projects/mosiac/03_03_idt_grid_AR-1600.png
- index: 4
  caption: Laminar flame speed validation
  topic: h2o2-validation
  description: Laminar flame speed vs. equivalence ratio for Ar, He and N2 dilution (each at 50% dilution) — the characteristic flame-speed bell curve, peaking near stoichiometric-to-slightly-rich conditions.
  src_800: assets/img/projects/mosiac/04_05_flame_speed-800.png
  src_1600: assets/img/projects/mosiac/04_05_flame_speed-1600.png
- index: 5
  caption: Extinction strain rate
  topic: h2o2-validation
  description: Twin premixed counterflow-flame extinction strain rate vs. equivalence ratio, for Ar, He and N2 dilution — the strain rate at which the flame can no longer be sustained.
  src_800: assets/img/projects/mosiac/05_06_extinction_strain-800.png
  src_1600: assets/img/projects/mosiac/05_06_extinction_strain-1600.png
- index: 6
  caption: JSR S-curve, Ar dilution
  topic: h2o2-validation
  description: Jet-stirred-reactor ignition S-curve (residence time vs. temperature) at three pressures with argon dilution — the characteristic S-shaped multi-valued ignition boundary of a stirred reactor.
  src_800: assets/img/projects/mosiac/06_07_jsr_scurve_AR-800.png
  src_1600: assets/img/projects/mosiac/06_07_jsr_scurve_AR-1600.png
- index: 7
  caption: Rate-of-production spectra
  topic: h2o2-validation
  description: A 3x3 grid of rate-of-production spectra (which reactions produce/consume each species, and by how much) across nine representative conditions — a diagnostic for identifying which reactions actually control the chemistry at each condition.
  src_800: assets/img/projects/mosiac/07_09_rop_spectra-800.png
  src_1600: assets/img/projects/mosiac/07_09_rop_spectra-1600.png
- index: 8
  caption: Species profile, case 50
  topic: h2o2-validation
  description: H2/O2/N2 mole-fraction time histories at one representative ignition condition (phi=6, T=1000K, P=100atm) — the raw species-concentration trace an ignition-delay or NeuralODE prediction is checked against.
  src_800: assets/img/projects/mosiac/08_04_species_profile_case-50-800.png
- index: 9
  caption: 'Live: configuring and running a real H2/O2 Nominal Simulation'
  topic: wt-nominal-video
  description: 'A real, screen-recorded MOSIAC Studio session (Qt''s own offscreen render pipeline, frame-captured live -- not a mockup): Cantera''s bundled 29-reaction h2o2.yaml mechanism, a set of ignition-delay targets computed directly from real constant-volume Cantera reactor runs (the original demo dataset this walkthrough was built against is no longer present in this checkout, so the targets were regenerated from scratch rather than faked), fed through the Nominal Simulation tool end to end. The run genuinely completes -- 30 real result tables in 15.8 real seconds, watched live in the Tables tab as it finishes.'
  src_800: assets/img/projects/mosiac/09_nominal_sim_walkthrough_poster-800.png
  src_1600: assets/img/projects/mosiac/09_nominal_sim_walkthrough_poster-1600.png
  video: assets/img/projects/mosiac/09_nominal_sim_walkthrough_poster.mp4
- index: 10
  caption: 'Live: Ignition-Delay Sensitivity, configured and run'
  topic: wt-idt-video
  description: 'The same real, live-recorded session driving a second, self-contained tool: ignition-delay sensitivity d ln(tau)/d ln(k) for H2 fuel at T=1200K, P=13.5atm, phi=1.0, constant-volume reactor, brute-force method, top 20 reactions. The run completes in well under a second, and the ranked result is physically exactly right: H + O2 <=> O + OH (the dominant chain-branching step) comes out as the single largest-magnitude coefficient (-1.62), and H + O2 + N2 <=> HO2 + N2 (a chain-terminating three-body step) is next, with the opposite sign (+0.79) -- faster branching shortens ignition delay, faster termination lengthens it. A tool that didn''t understand the chemistry couldn''t get that sign flip right by accident.'
  src_800: assets/img/projects/mosiac/10_idt_sensitivity_walkthrough_poster-800.png
  src_1600: assets/img/projects/mosiac/10_idt_sensitivity_walkthrough_poster-1600.png
  video: assets/img/projects/mosiac/10_idt_sensitivity_walkthrough_poster.mp4
- index: 11
  caption: The 30-target design space for the optimization attempt
  topic: wt-7-design-space
  description: Temperature/pressure/equivalence-ratio coverage of the reduced 30-target subset used for the optimization run below, generated automatically as the first step of that pipeline before any fitting starts.
  src_800: assets/img/projects/mosiac/11_09_tpphi_space-800.png
- index: 12
  caption: Step 7 — Optimization, running
  topic: wt-8-opt-running
  description: The Optimization tool, pointed at a copy of the bundled H2 project config with generations cut from 20,000 to 5 and targets from 426 to 30 for a demo-length run (the real setting would take hours) -- everything else (mechanism, solver, targets) is the same real H2/O2 case.
  src_800: assets/img/projects/mosiac/12_07_opt_filled_running-800.png
- index: 13
  caption: Step 8 — a real limitation, shown rather than hidden
  topic: wt-9-opt-error
  description: 'The optimizer got through target export, the design-space plot above, and parsing the joint-uncertainty data (3 reactions) before failing: its sensitivity-analysis sub-step expects a nominal-simulation case directory at a specific relative path (nominal/case-7) that this standalone run hadn''t produced yet. A real dependency between two of the GUI''s own tools, caught by actually running them back to back rather than reading the source.'
  src_800: assets/img/projects/mosiac/13_08_opt_error-800.png
