neural-ode-playground:
- index: 1
  caption: 11-optimizer race on the Van der Pol benchmark, proper names + final numbers
  topic: optimizer-race
  description: All 11 gradient-based optimizers in the registry, trained from scratch on the same tiny synthetic problem (a Van der Pol oscillator, this project's non-chemistry test family), same seed, same 80-epoch budget -- re-run for this page with each curve's actual final loss value shown directly in the legend. Nadam reached the lowest final loss (0.696); L-BFGS barely moved off its starting point (9.52 -> 9.27, effectively stuck) and Adadelta was similarly poor (8.19) -- both an order of magnitude worse than the best performers after 80 epochs. Adam and AdamW land on nearly identical curves (1.040 vs. 1.040), a real result, not a plotting artifact -- the small weight-decay term barely changes anything on this problem. This chart covers gradient-based methods only; a genuine heuristic/population-based comparison (CMA-ES and a genetic algorithm against gradient methods, same shared-budget discipline) is on the dokimazo project page's own solver race.
  src_800: assets/img/projects/neural-ode-playground/01_optimizer_race-800.png
  subject: playground
- index: 2
  caption: Normalization ablation — raw baseline vs. 9 normalized arms
  topic: ablation
  description: The project's own headline finding — a real 50-run, 5-seed factorial ablation (matched-seed paired t-test) shows normalizing temperature cuts test loss by roughly an order of magnitude (2.314e5 to 2.662e4, p = 3e-15) — normalizing species alone, with temperature left raw, changes nothing, bit-for-bit, because temperature's gradient already owns effectively 100% of an equal-weight loss.
  src_800: assets/img/projects/neural-ode-playground/02_ablation_comparison-800.png
  src_1600: assets/img/projects/neural-ode-playground/02_ablation_comparison-1600.png
  subject: playground
- index: 3
  caption: RL Arena — the real PPO agent's weight-space trajectory
  topic: rl-arena
  description: The RL Arena, live against a real running trainer_kind='rl' job — not a mockup. Purple trail — the agent's actual path through a 2D slice of weight space; orange arrow — the current step's action.
  src_800: assets/img/projects/neural-ode-playground/03_rl_arena_screenshot-800.png
  subject: playground
- index: 4
