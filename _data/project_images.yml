  src_800: assets/img/projects/muq-sac/04_correlation_heatmap_A-800.png
- index: 5
  caption: n-exponent correlation heatmap
  topic: correlation
  description: The same pairwise-correlation heatmap for the temperature-exponent parameter (n) instead of A — part of the same three-parameter correlation-structure analysis.
  src_800: assets/img/projects/muq-sac/05_correlation_heatmap_n-800.png
- index: 6
  caption: Ea correlation heatmap
  topic: correlation
  description: The same pairwise-correlation heatmap for activation energy (Ea) — completing the three-parameter (A, n, Ea) correlation-structure picture.
  src_800: assets/img/projects/muq-sac/06_correlation_heatmap_Ea-800.png
- index: 7
  caption: Gaussian-process surrogate parity plot
  topic: surrogate
  description: Predicted-vs-actual parity plot for a Gaussian-process response-surface surrogate fit to methyl-butanoate data — one of three surrogate types (polynomial, GP, RBF) compared for how well each reproduces the underlying simulation.
  src_800: assets/img/projects/muq-sac/07_parity_v2_GP-800.png
- index: 8
  caption: 'Class A sampling: kappa scale, real UQ limits, fit quality per sample'
  topic: animation
  description: 'Arrhenius-curve sampling for the same n-heptane reaction (nC7H16 + H -> C7H15-3 + H2, R1071), reworked in kappa scale: the left panel plots each accepted sample''s real Δκ_S(T) curve against 1/T, with MUQ-SAC''s own real ±f_prior_S(T) uncertainty bound drawn explicitly (dashed) rather than left implicit -- that is the actual UQ limit the sampling is constrained to. The right panel tracks, per sample, the real fit-quality objective (how closely that sample''s curve matches a best-fit scaled copy of the UQ envelope''s own shape) -- Class A''s real Moore-Penrose pseudo-inverse solve, a closed-form linear solve rather than an iterative search.'
  src_800: assets/img/projects/muq-sac/08_muqsac_kappa_classA_poster-800.png
  src_1600: assets/img/projects/muq-sac/08_muqsac_kappa_classA_poster-1600.png
  video: assets/img/projects/muq-sac/08_muqsac_kappa_classA_poster.mp4
- index: 9
  caption: 'Class C sampling: kappa scale, real UQ limits, fit quality per sample'
  topic: animation
  description: The same kappa-scale treatment for Class C (ordinary least-squares, closed-form) -- a second, independently-run sampling method on the same real reaction, same real UQ envelope, same per-sample fit-quality readout, so the two closed-form classes (A and this one) can be compared directly rather than taken on faith.
  src_800: assets/img/projects/muq-sac/09_muqsac_kappa_classC_poster-800.png
  src_1600: assets/img/projects/muq-sac/09_muqsac_kappa_classC_poster-1600.png
  video: assets/img/projects/muq-sac/09_muqsac_kappa_classC_poster.mp4
- index: 10
  caption: 'Class D sampling: kappa scale, real UQ limits, fit quality per sample'
  topic: animation
  description: The same kappa-scale, UQ-limit, fit-quality-per-sample treatment for Class D (SLSQP, reduced 2-parameter fit) -- an iterative optimizer this time, not a closed-form solve, on the same real reaction and UQ envelope as the other three classes.
  src_800: assets/img/projects/muq-sac/10_muqsac_kappa_classD_poster-800.png
  src_1600: assets/img/projects/muq-sac/10_muqsac_kappa_classD_poster-1600.png
  video: assets/img/projects/muq-sac/10_muqsac_kappa_classD_poster.mp4
- index: 11
  caption: 'Class B sampling: kappa scale, real UQ limits, fit quality per sample'
  topic: animation
  description: The same treatment for Class B (SLSQP, full 3-parameter fit) -- the slowest of the four methods (see the measured-cost figure below), shown here with fewer real samples (10 rather than 16) purely because each one is genuinely more expensive to compute, not because the method is different in kind. Class B has no reduced (A, n)-only mode in MUQ-SAC's own code -- its real sampler only supports the full 3-parameter fit, so this one uses all three Arrhenius parameters rather than the 2-parameter subset the other three classes use.
  src_800: assets/img/projects/muq-sac/11_muqsac_kappa_classB_poster-800.png
  src_1600: assets/img/projects/muq-sac/11_muqsac_kappa_classB_poster-1600.png
  video: assets/img/projects/muq-sac/11_muqsac_kappa_classB_poster.mp4
- index: 12
  caption: All four sampling-method classes, live, one frame
  topic: sampling-methods
  description: 'The single-frame images this page used to show (before this fix) were mislabeled animated GIFs -- broken, only ever one frame -- and constrained to a single method (Class C) on a single reaction. This is the real fix: all four of MUQ-SAC''s sampling-method classes (A: Moore-Penrose pseudoinverse, B: SLSQP full 3-parameter fit, C: least-squares closed-form, D: SLSQP reduced 2-parameter fit) building up their real sample bands simultaneously, one frame, with each panel''s own measured compute-time readout ticking at its true relative rate -- Class B visibly crawls while A, C and D finish almost instantly, because that time difference is real, not staged.'
  src_800: assets/img/projects/muq-sac/12_four_classes_live_poster-800.png
  src_1600: assets/img/projects/muq-sac/12_four_classes_live_poster-1600.png
  video: assets/img/projects/muq-sac/12_four_classes_live_poster.mp4
- index: 13
  caption: Measured sampling cost across all four classes -- five orders of magnitude
  topic: sampling-methods
  description: 'The timing story behind the video above, measured directly (not estimated): 100 samples cost 204.3 s under Class B''s full 3-parameter SLSQP fit, 5.5 s under Class D''s reduced 2-parameter SLSQP fit, and 0.018-0.02 s under Class A''s Moore-Penrose pseudoinverse and Class C''s closed-form least-squares -- roughly 10,000x apart between the slowest and fastest methods for statistically equivalent output.'
  src_800: assets/img/projects/muq-sac/13_four_classes_static-800.png
  src_1600: assets/img/projects/muq-sac/13_four_classes_static-1600.png
