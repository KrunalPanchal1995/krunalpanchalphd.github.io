- index: 18
  caption: Instrument Panel — static filmstrip (6 frames)
  topic: invented-technique
  description: A static 6-frame filmstrip companion to the Instrument Panel video, for reviewers who cannot play the MP4 directly (this portfolio's own contact-sheet tooling shows only a video's first frame as a poster).
  src_800: assets/img/projects/turbulence-closures/18_tv_mov01_instrument_panel_filmstrip-800.png
  src_1600: assets/img/projects/turbulence-closures/18_tv_mov01_instrument_panel_filmstrip-1600.png
- index: 19
  caption: Two-point spatial autocorrelation and integral length scale
  topic: statistics
  description: R(r) computed from the decaying-2D-turbulence snapshot's own u velocity component along one axis, via the Wiener-Khinchin theorem. Integral length scale L=0.588 m (truncated at R(r)'s first zero-crossing, the standard practical cutoff on a finite/periodic domain) — the field's own characteristic large-eddy size, directly comparable to the k0=6 forcing wavenumber of its McWilliams (1984) initial condition (L_forcing=2π/6=1.047 m).
  src_800: assets/img/projects/turbulence-closures/19_tv_fig08_two_point_correlation-800.png
- index: 20
  caption: Quadrant decomposition of the resolved shear-stress correlation
  topic: statistics
  description: 'Quadrant analysis (Wallace, Eckelmann & Brodkey, 1972) applied to the same decaying-2D-turbulence snapshot''s spatial velocity fluctuations — NOT a wall-bounded shear flow, so the classical "ejection"/"sweep" names are not literally applicable here (disclosed in the code); the underlying quadrant decomposition of -⟨u′v′⟩ is still meaningful. Individual quadrant fractions exceeding 100%/going negative is itself a genuine result: this unforced-shear field has a small net -⟨u′v′⟩, so normalizing by that small denominator amplifies the four quadrants'' own comparably-sized raw contributions — exactly the contrast the classical near-wall picture (sustained mean shear keeps the net correlation large) would not show.'
  src_800: assets/img/projects/turbulence-closures/20_tv_fig09_quadrant_analysis-800.png
- index: 21
  caption: 'Budget Residual Field: a genuine limitation found applying the technique to a relaxed RANS solve'
  topic: budget-analysis
  description: The local imbalance of Realizable k-ε's own EXACT discrete k-equation (face-averaged-diffusivity finite-volume form, reproduced verbatim from the closure's own code), evaluated at every node post-solve. Contrary to a first-guess expectation ("near-zero at interior nodes, large only at wall-function Dirichlet rows"), the MEASURED residual is large at every node — traced to this closure's own under-relaxed nested-Picard design, which intentionally damps oscillation at the cost of the returned k/ε ever exactly satisfying the discrete equation with the final eddy viscosity at any single instant. A genuine, disclosed LIMITATION of this diagnostic technique for relaxed-iterative RANS solves, kept in as the honest result rather than replaced with a cleaner cherry-picked case.
  src_800: assets/img/projects/turbulence-closures/21_tv_fig10_budget_residual_field-800.png
- index: 22
  caption: 'Backscatter Flash Map: spatial structure of upscale energy transfer (invented technique)'
  topic: invented-technique
  description: 'Left: the full vorticity field evolving under Smagorinsky LES. Right: the spatial structure reconstructed from ONLY the wavenumber shells where the resolved-scale spectral flux Π(k) is currently negative — i.e. energy moving up-scale at that instant, "backscatter" in the LES sense (Piomelli et al., 1991). Deliberately NOT the same as a local eddy-viscosity SGS model''s own dissipation field (non-negative by construction, can never itself display backscatter) — this is the RESOLVED-scale flux''s own negative-transfer content, made spatially visible instead of left as an abstract k-space curve. Novelty search: found spectral-flux plots and backscatter discussion in the LES literature, but no video reconstructing and displaying the specific spatial structure responsible for backscatter at each instant.'
  src_800: assets/img/projects/turbulence-closures/22_tv_mov04_backscatter_flash_map-800.png
  src_1600: assets/img/projects/turbulence-closures/22_tv_mov04_backscatter_flash_map-1600.png
  video: assets/img/projects/turbulence-closures/22_tv_mov04_backscatter_flash_map.mp4
- index: 23
  caption: Velocity-increment PDFs at several separations
  topic: statistics
  description: 'δu(r)=u(x+r)-u(x) histogrammed at r=1,4,16 grid points (normalized by each separation''s own standard deviation), log-scale y-axis, against a Gaussian reference. HONEST RESULT: all three separations track the Gaussian closely, with no clear widening of the tails at small r — the classical 3D-turbulence intermittency signature is NOT detected here. This is not claimed as a general property of turbulence; it reflects this specific case''s real limitations (a single decaying 2D snapshot, heavily damped by the Smagorinsky SGS closure, too small a statistical sample for a reliable tail measurement), not a claim that turbulence lacks intermittency.'
  src_800: assets/img/projects/turbulence-closures/23_tv_fig11_velocity_increment_pdf-800.png
- index: 24
  caption: 'Magnitude Cascade Ledger: order-of-magnitude analysis of a real Picard iteration (invented technique)'
  topic: invented-technique
  description: 'The `tau_wall`/`change` (residual) terms logged by the new `RunLogger` telemetry API at every Picard iteration of a real Realizable k-epsilon channel solve (N=61, wall-clustered), rendered as a Magnitude Cascade Ledger — every logged term overlaid on one shared log10-magnitude axis, with the currently-dominant term''s own line segment drawn thick so dominance switches are visible at a glance rather than requiring cross-reading separate plots. `tau_wall` settles to its converged value within a handful of iterations while `change` continues decaying for many more — a genuine, measured separation between how fast an aggregate force balance settles versus how fast the full iterative residual does. Novelty search: found log-magnitude plots of individual quantities and unrelated "waterfall" charts for cumulative sums, but no prior art overlaying an equation''s own full term set with dominance highlighted as it changes over a run.'
  src_800: assets/img/projects/turbulence-closures/24_fig12_magnitude_cascade_ledger-800.png
- index: 25
  caption: 'Vanishing Horizon: a real Picard residual''s own decay against two distinct vanishing floors (invented technique)'
  topic: invented-technique
  description: 'The SAME Realizable k-epsilon channel run as the Magnitude Cascade Ledger figure. `change` (the Picard residual) decays roughly linearly in log-space from iteration ~50 onward — a clean geometric convergence rate, visible directly from the plotted slope — crossing the relative-irrelevance floor (dashed: the residual''s own scale relative to the equation''s dominant term) well before float64''s absolute denormal floor (dash-dot) becomes relevant at all. The real point: a residual can stay numerically alive by a huge margin while already being physically irrelevant to the equation''s own dominant scale — two genuinely distinct notions of "vanishing" this technique makes visually distinguishable for the first time in this study. Novelty search: found log-decay plots and numerical-underflow discussion treated separately, but no prior art drawing both thresholds on the same axis at once.'
  src_800: assets/img/projects/turbulence-closures/25_fig13_vanishing_horizon-800.png
- index: 26
  caption: 'Decade-Band Field Map: a real decaying-turbulence snapshot in discrete power-of-ten bands (invented technique)'
  topic: invented-technique
  description: 'The same McWilliams (1984)-initialized decaying 2D turbulence field this study''s other figures use (N=96, t=3.0s, ν=1e-3), rendered in discrete power-of-ten bands instead of a continuous colormap. A genuine, checked-against-expectation finding: the dominant structure is NOT "vortex cores several decades above background" (a first-draft caption assumption that did not survive actually looking at the rendered figure) — at this modest diffusion time the field has not developed that much dynamic range, so most of the domain sits at decade 0. What the discrete banding DOES make legible, that a continuous colormap does not, is the field''s own thin filamentary zero-crossing topology: everywhere vorticity changes sign, |ω| passes through very small values, producing the dark low-decade threads visible here. Novelty search: found symmetric-log color scaling used routinely for large-dynamic-range fields, and discrete choropleth banding used in other domains (e.g. earthquake-magnitude maps), but no prior art applying discrete decade banding to a CFD scalar field''s own spatial structure as its own named technique.'
  src_800: assets/img/projects/turbulence-closures/26_fig14_decade_band_vorticity-800.png
- index: 27
  caption: 'ParaView-class pipeline: contour and gradient filters on a real 2D turbulence field'
  topic: infrastructure
  description: 'The new `cfdpy.viz.filters` module''s `contour` (left, black lines: the ω=0 isocontour via marching squares) and `gradient` (right, central differences against the field''s own node coordinates) filters, run against a real decaying-2D-turbulence snapshot wrapped in the new `FieldDataset`/`TimeSeries` data model. The same run was also written out through the new `writers.write_time_series` as a genuine ParaView-openable `.vti`/`.pvd` time series — written and read back as part of generating this figure, not merely claimed to work — the source-to-filter-to-view pipeline this study''s data previously had no path into at all (before this session, VTK output existed with no filter/animation layer above it).'
  src_800: assets/img/projects/turbulence-closures/27_fig15_paraview_pipeline_demo-800.png
  src_1600: assets/img/projects/turbulence-closures/27_fig15_paraview_pipeline_demo-1600.png
- index: 28
  caption: 'Pipeline.Animation: a movie declared, not hand-scripted'
  topic: infrastructure
  description: A decaying-2D-turbulence run (N=72, 51 frames) rendered entirely through the new `pipeline.Animation` class — `Animation(Pipeline(time_series), field_name='omega').render(path)`, three lines, versus every earlier video in this study's own portfolio (from the freely-decaying vorticity-evolution video through the Backscatter Flash Map), each a bespoke hand-written animation script. A fixed color scale is applied automatically (not optional) across every frame, per this toolkit's own long-standing rule that per-frame autoscaling is "the single most common way a CFD animation misrepresents its own dynamics.\"
  src_800: assets/img/projects/turbulence-closures/28_mov05_pipeline_animation-800.png
