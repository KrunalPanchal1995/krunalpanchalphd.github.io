gasification:
- index: 1
  caption: H2 yield vs steam-to-biomass ratio (non-monotonic finding)
  topic: headline
  description: Hydrogen yield (vol%, dry basis) vs. steam-to-biomass ratio, with and without the MgCO3 catalyst — the catalytic curve climbs to a peak around SBR~0.26 and then collapses by SBR~0.47, falling below the no-catalyst case. This non-monotonic shape is the thesis's headline experimental finding.
  src_800: assets/img/projects/gasification/01_02_h2_vs_sbr-800.png
- index: 2
  caption: Cold-gas efficiency vs steam-to-biomass ratio
  topic: headline
  description: Cold-gas efficiency vs. steam-to-biomass ratio, catalytic and non-catalytic — moves in lockstep with the hydrogen-yield curve, rising then falling at the same steam ratio, reinforcing that both are driven by the same underlying mechanism.
  src_800: assets/img/projects/gasification/02_05_cge_vs_sbr-800.png
- index: 3
  caption: Mass-balance Sankey diagram
  topic: rigor
  description: A Sankey diagram tracing feedstock mass through the gasifier into product gas, tar, char and losses — the visual account behind the reported 0.920-0.995 mass-balance closure across all 14 runs.
  src_800: assets/img/projects/gasification/03_15_mass_balance_sankey-800.png
  src_1600: assets/img/projects/gasification/03_15_mass_balance_sankey-1600.png
- index: 4
  caption: Operating map across all 14 runs
  topic: rigor
  description: All fourteen experimental runs (seven steam ratios x two catalyst conditions) plotted on one operating map — the complete design-of-experiments coverage behind every other result in this project.
  src_800: assets/img/projects/gasification/04_18_operating_map-800.png
- index: 5
  caption: Combustion-zone temperature explains the H2 non-monotonicity
  topic: headline
  description: Combustion-zone temperature vs. steam-to-biomass ratio, from a 2026 re-analysis — also non-monotonic, and it correlates with hydrogen yield (Pearson r=0.80 pooled, r=0.96 catalytic) far more strongly than steam ratio does directly (r=0.10). This is the mechanism behind the headline finding, not just a restatement of it.
  src_800: assets/img/projects/gasification/05_25_tcomb_vs_sbr_energy_balance-800.png
- index: 6
  caption: Equilibrium-model vs measured parity
  topic: rigor
  description: Predicted (thermodynamic equilibrium model) vs. measured product-gas composition — points off the diagonal show exactly where a simple equilibrium assumption fails to explain the real gasifier behavior, motivating the deeper kinetic re-analysis.
  src_800: assets/img/projects/gasification/06_21_equilibrium_vs_measured_parity-800.png
  src_1600: assets/img/projects/gasification/06_21_equilibrium_vs_measured_parity-1600.png
- index: 7
  caption: Producer-gas flame from the rig
  topic: experiment
  description: The producer-gas flame at the rig's outlet during an experimental run — direct visual evidence the gasifier was producing combustible syngas, not just a numerical result.
  src_800: assets/img/projects/gasification/07_Flame-800.png
- index: 8
  caption: Downdraft gasifier rig, campaign run
  topic: experiment
  description: The pilot-scale downdraft fixed-bed gasifier rig (525mm ID, 2.165m tall) during a data-collection campaign in May 2018.
  src_800: assets/img/projects/gasification/08_IMG_20180510_105528-800.png
  src_1600: assets/img/projects/gasification/08_IMG_20180510_105528-1600.png
- index: 9
  caption: Gas chromatography setup
  topic: experiment
  description: The gas chromatography instrument used to measure product-gas composition (H2, CO, CO2, CH4, N2) for every run in the experimental campaign.
  src_800: assets/img/projects/gasification/09_Appendix_3__3.1_Gas_chromatography-800.png
