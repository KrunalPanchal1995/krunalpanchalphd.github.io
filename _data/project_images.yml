  description: 'The full Hopf-sequence regime progression (ignition transient, steady laminar, flickering onset, periodic flickering) shown simultaneously in one 2x2 frame, each quadrant its own real-time instrument: the tracked flame boundary, height/area/volume traces, and -- the point of this view -- flame width tracked at multiple zone heights at once (the stacked traces in each quadrant''s bottom panel), not a single fixed point.'
