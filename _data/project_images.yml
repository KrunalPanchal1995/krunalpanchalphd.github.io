cfdcore:
- index: 1
  caption: Method-of-manufactured-solutions convergence
  topic: numerics-verification
  description: A method-of-manufactured-solutions convergence study — the numerical error should shrink at the theoretically predicted rate as the mesh is refined, confirming the solver's discretization is implemented correctly rather than just "looking right."
  src_800: assets/img/projects/cfdcore/01_04_mms_convergence-800.png
- index: 2
  caption: Numerical stability regions
  topic: numerics-verification
  description: Stability regions for the solver's time-integration schemes — the boundary in parameter space where a numerical scheme stops producing bounded solutions, verified against known theory for each scheme implemented.
  src_800: assets/img/projects/cfdcore/02_03_stability_regions-800.png
  src_1600: assets/img/projects/cfdcore/02_03_stability_regions-1600.png
- index: 3
  caption: SDF-kernel revolved nozzle
  topic: geometry-kernel
  description: A revolved-nozzle test shape generated by the signed-distance-field geometry engine — one of three independent meshing/CAD backends cross-checked against each other on the same 15 test shapes.
  src_800: assets/img/projects/cfdcore/03_sdf_revolved_nozzle-800.png
- index: 4
  caption: Gmsh-kernel revolved nozzle (cross-engine check)
  topic: geometry-kernel
  description: The identical revolved-nozzle shape regenerated through the Gmsh backend — compare directly against the SDF-kernel and PicoGK-kernel versions to see that all three independent geometry engines agree.
  src_800: assets/img/projects/cfdcore/04_gmsh_revolved_nozzle-800.png
- index: 5
  caption: Turbine fluid-structure interaction result
  topic: fsi-structural
  description: A coupled fluid-structure-interaction simulation of flow around a turbine blade — the structural deformation and the surrounding flow field solved together, not as two separate uncoupled problems.
  src_800: assets/img/projects/cfdcore/05_turbine_fsi_result-800.png
  src_1600: assets/img/projects/cfdcore/05_turbine_fsi_result-1600.png
- index: 6
  caption: Conjugate heat transfer validation
  topic: incompressible-heat-transfer
  description: A conjugate-heat-transfer validation case — heat conduction through a solid coupled to convective heat transfer in the adjacent fluid, solved as one consistent system.
  src_800: assets/img/projects/cfdcore/06_cht_result-800.png
- index: 7
  caption: Boiling curve validation
  topic: multiphase-boiling
  description: A predicted boiling curve (heat flux vs. wall superheat) compared against expected literature behavior — checking the solver's boiling/phase-change model reproduces the correct nucleate-to-film-boiling transition shape.
  src_800: assets/img/projects/cfdcore/07_boiling_curve-800.png
- index: 8
  caption: 'Hot-spot ignition: a warm patch turning into a self-sustaining flame'
  topic: combustion-propulsion
  description: 'What ignition actually looks like, computed with PANSOPHIA: a small pre-heated patch -- the kind of hot spot a spark or a hot particle leaves behind -- sits in an otherwise cool, fuel-filled space. For a while it just slowly warms (heat trickling in from the surrounding reaction outpaces the heat leaking away); then, at a real, measured tipping point, the reaction runs away with itself, the patch heats sharply, and it settles into a genuine self-sustaining burning kernel that keeps consuming fuel on its own -- the physical definition of ignition, not just "it got hot."'
  src_800: assets/img/projects/cfdcore/08_rf_ignition_transient-800.png
  src_1600: assets/img/projects/cfdcore/08_rf_ignition_transient-1600.png
- index: 9
  caption: Microfluidics outlet-purity heatmap
  topic: microfluidics
  description: A heatmap from a ~30-cell parameter sweep showing particle-separation purity at the microfluidic device's outlet across different design choices — the result that motivated building this solver in the first place, after a commercial tool's particle-tracing feature failed to work at all.
  src_800: assets/img/projects/cfdcore/09_outlet_purity_heatmap-800.png
  src_1600: assets/img/projects/cfdcore/09_outlet_purity_heatmap-1600.png
- index: 10
  caption: Particle-separation resolution sweep
  topic: microfluidics
  description: How well the microfluidic device separates particles of different sizes, swept across design parameters — the companion figure to the outlet-purity heatmap from the same application study.
  src_800: assets/img/projects/cfdcore/10_separation_resolution-800.png
  src_1600: assets/img/projects/cfdcore/10_separation_resolution-1600.png
- index: 11
  caption: Ornstein-Uhlenbeck sample paths
  topic: stochastic-uq
  description: Sample paths of an Ornstein-Uhlenbeck stochastic process — part of the solver's stochastic/SDE turbulence module, used for closure-model validation against known analytical statistics.
  src_800: assets/img/projects/cfdcore/11_S1_01_ou_paths-800.png
  src_1600: assets/img/projects/cfdcore/11_S1_01_ou_paths-1600.png
- index: 12
  caption: Von Neumann stability analysis
  topic: numerics-verification
  description: Von Neumann stability analysis of the discretization schemes — the amplification factor of a Fourier error mode as a function of wavenumber, the analytical companion to the empirical stability-region and MMS-convergence checks above.
  src_800: assets/img/projects/cfdcore/12_02_von_neumann-800.png
- index: 13
  caption: CFL-number sweep
  topic: numerics-verification
  description: Solution behavior swept across CFL number — how far the time-step size can be pushed before a scheme's stability limit is reached, benchmarked for each integrator the solver implements.
  src_800: assets/img/projects/cfdcore/13_05_cfl_sweep-800.png
- index: 14
  caption: PicoGK-kernel revolved nozzle (third engine)
  topic: geometry-kernel
  description: The same revolved-nozzle shape from a third, independent geometry engine (PicoGK). All three backends report the identical enclosed volume for this shape (5.4633e-05, valid and watertight) — cross-engine agreement, not just three renders that happen to look similar.
  src_800: assets/img/projects/cfdcore/14_picogk_revolved_nozzle-800.png
- index: 15
  caption: Lid-driven cavity flow
  topic: incompressible-heat-transfer
  description: The classical lid-driven cavity benchmark — a standard test case for verifying an incompressible-flow solver reproduces the expected recirculation structure before it's trusted on harder problems.
  src_800: assets/img/projects/cfdcore/15_cavity_result-800.png
  src_1600: assets/img/projects/cfdcore/15_cavity_result-1600.png
- index: 16
  caption: Flow boiling in a heated channel
  topic: multiphase-boiling
  description: A flow-boiling case in a heated channel — phase change under forced convection, rather than the pool-boiling curve above, exercising the multiphase model's response to bulk flow.
  src_800: assets/img/projects/cfdcore/16_flow_boiling-800.png
  src_1600: assets/img/projects/cfdcore/16_flow_boiling-1600.png
- index: 17
  caption: 2D fluid-structure interaction case
  topic: fsi-structural
  description: A simpler 2D fluid-structure-interaction case, used to isolate and debug the coupling scheme before it's applied to the full 3D turbine case above.
  src_800: assets/img/projects/cfdcore/17_fsi_2d_result-800.png
  src_1600: assets/img/projects/cfdcore/17_fsi_2d_result-1600.png
- index: 18
  caption: Micromixer demonstration case
  topic: microfluidics
  description: A micromixer demonstration case run directly through the solver's own geometry and meshing pipeline — showing the microfluidics module working end-to-end on a self-contained example, independent of the particle-separation application study above.
  src_800: assets/img/projects/cfdcore/18_mf_micromixer_demo-800.png
- index: 19
  caption: Variance-reduction comparison
  topic: stochastic-uq
  description: A variance-reduction technique compared against plain Monte Carlo sampling for the same stochastic quantity — the practical payoff of the SDE module beyond just being able to simulate one.
  src_800: assets/img/projects/cfdcore/19_S2_02_variance_reduction-800.png
  src_1600: assets/img/projects/cfdcore/19_S2_02_variance_reduction-1600.png
- index: 20
  caption: Stochastic sub-grid-scale closure
  topic: stochastic-uq
  description: A stochastic sub-grid-scale (SGS) turbulence closure result — where the stochastic module connects back to the solver's turbulence modeling, not just standalone SDE demonstrations.
  src_800: assets/img/projects/cfdcore/20_S4_01_stochastic_sgs-800.png
  src_1600: assets/img/projects/cfdcore/20_S4_01_stochastic_sgs-1600.png
- index: 21
  caption: 3D pipe flow vs. exact Hagen-Poiseuille
  topic: mfV-validation
  description: 'The base 3D pipe-flow field the particle tracer below runs on, checked against the exact Hagen-Poiseuille profile: max relative error 2.7e-14, i.e. machine precision, not just a close-looking curve.'
  src_800: assets/img/projects/cfdcore/21_a6_pipe_flow_spotcheck-800.png
- index: 22
  caption: Segre-Silberberg tubular pinch — bidirectional migration
  topic: mfV-validation
  description: 'A real 3D flow field and a real 3D particle tracer reproduce the Segre-Silberberg (1962) inertial-migration mechanism directly: all four tracked particles move toward an intermediate equilibrium radius, two from inside moving out and two from outside moving in. The model''s own self-consistent equilibrium (0.5R) differs from the literature''s fitted value (0.6R) — a disclosed, understood quantitative miss (a direct, expected consequence of using a documented literature substitution for a paywalled fitted coefficient), not a hidden one.'
  src_800: assets/img/projects/cfdcore/22_a6_segre_silberberg-800.png
- index: 23
  caption: Dean secondary-flow intensity scaling
  topic: mfV-validation
  description: 'Measured Dean secondary-flow intensity vs. Dean number in a curved channel: local log-log slope 1.99-2.01 at low De matches Dean''s (1928) theoretical De^2 scaling almost exactly, declining toward Ookawara''s (2004) De^1.63 high-De asymptote — the classic curved-duct secondary-flow signature, reproduced quantitatively.'
  src_800: assets/img/projects/cfdcore/23_a5_dean_intensity-800.png
  src_1600: assets/img/projects/cfdcore/23_a5_dean_intensity-1600.png
- index: 24
  caption: Four-vortex transition — a disclosed miss
  topic: mfV-validation
  description: 'A documented miss, kept in rather than dropped: the literature predicts a transition from a two-vortex to a four-vortex Dean secondary flow at a critical Dean number (visible as a 1-to-3 jump in an outer-wall-crossing probe). This model''s own probe stays at 1 crossing across the full swept range — investigated directly (a perturbed-restart search relaxes back to the same state at machine precision), so this reads as a genuine limitation of the current formulation, not an under-searched parameter.'
  src_800: assets/img/projects/cfdcore/24_a5_four_vortex_miss-800.png
- index: 25
  caption: Brinkman-channel exact solution
  topic: mfV-validation
  description: 'The closed-form Brinkman-channel velocity profile the density-based topology-optimization formulation actually solves, at four penalization strengths: plain Poiseuille flow smoothly deforms into a thin-wall-layer "plug" profile as the penalization parameter grows, with the ODE residual checked below 1e-6 relative (ForwardDiff-verified) at every value.'
  src_800: assets/img/projects/cfdcore/25_d1_brinkman_exact_profiles-800.png
- index: 26
  caption: Brinkman penalization vs. a body-fitted mesh
  topic: mfV-validation
  description: 'Cross-checking the Brinkman penalization method (used for topology optimization) against a genuinely body-fitted mesh of the same geometry: leak velocity inside the penalized "solid" region falls monotonically as expected, but the velocity mismatch outside it is non-monotonic in the penalization strength — a real, mesh-resolution-dependent conditioning effect, confirmed (not just observed) by re-running at 4x finer resolution and watching both the minimum-error location and its achievable value shift in the predicted direction.'
  src_800: assets/img/projects/cfdcore/26_d2_brinkman_vs_bodyfitted-800.png
  src_1600: assets/img/projects/cfdcore/26_d2_brinkman_vs_bodyfitted-1600.png
- index: 27
  caption: Dissipated-power identity check
  topic: mfV-validation
  description: 'A physical consistency check on the objective functional a topology optimization would minimize: total viscous dissipation computed one way (integrating Phi(u) over the domain) against computed a completely independent way (pressure drop times flow rate) agree to within FEM discretization error (0.08% and 0.18% for the two viscous-term formulations tested).'
  src_800: assets/img/projects/cfdcore/27_d3_dissipated_power_identity-800.png
- index: 28
  caption: Analytic design-sensitivity gradient vs. finite differences
  topic: mfV-validation
  description: 'The pre-optimization gate any gradient-based topology optimization depends on: the analytic design-sensitivity gradient overlaid exactly on a central-finite-difference estimate at every design variable, agreeing to about 1e-10 relative at two different step sizes — a wrong gradient here would silently break every downstream optimization result, so it is checked directly rather than assumed.'
  src_800: assets/img/projects/cfdcore/28_d4_gradient_vs_finite_differences-800.png
  src_1600: assets/img/projects/cfdcore/28_d4_gradient_vs_finite_differences-1600.png
- index: 29
  caption: S9 geometry creator — revolve feature
  topic: geometry-kernel
  description: 'A from-scratch, dependency-free signed-distance-field CAD kernel''s revolve feature: a rectangle profile revolved into an annulus, part of a new feature-tree geometry creator (fillet, shell, sweep, pattern) built on the same SDF representation as the cross-engine geometry-kernel work above.'
  src_800: assets/img/projects/cfdcore/29_revolve-800.png
- index: 30
  caption: S9 geometry creator — fillet feature
  topic: geometry-kernel
