dokimazo:
- index: 1
  caption: Conformer search optimization process — n-dodecane relaxing toward its lowest-energy shape
  topic: rl-rotor-search
  description: The RL rotor-tuning agent's best-found conformer at successive training checkpoints, rendered from the molecule's real RDKit 3D coordinates and played forward then backward as a seamless loop. Energy (kcal/mol) is annotated on every frame; the last frame is this video's poster image for viewers with reduced motion enabled.
  src_800: assets/img/projects/dokimazo/01_04_conformer_optimization_poster-800.png
  video: assets/img/projects/dokimazo/01_04_conformer_optimization_poster.mp4
- index: 2
  caption: REINFORCE training curve vs. the two reference oracles
  topic: rl-rotor-search
  description: Batch-mean and best-so-far MMFF94 energy over 400 multi-step REINFORCE training steps, against dokimazo's own IPOP-CMA-ES and RDKit's ETKDG+MMFF94 reference pipeline as horizontal lines — the same three-way, honest-benchmark discipline this project's earlier conformer-search result used.
  src_800: assets/img/projects/dokimazo/02_01_training_curve-800.png
- index: 3
  caption: Three-way benchmark — final energy and evaluation cost, n-dodecane
  topic: rl-rotor-search
  description: Final MMFF94 energy reached and force-field evaluation count for all three methods, reported side by side whether or not the new RL method wins — this project's standing benchmark discipline.
  src_800: assets/img/projects/dokimazo/03_02_three_way_benchmark-800.png
- index: 4
  caption: Rotor-angle convergence toward the all-anti ground truth
  topic: rl-rotor-search
  description: All 11 backbone torsion angles of the RL agent's best-found conformer, tracked across training, converging toward +/-180 degrees — the independent, structural ground truth for an unbranched alkane's global MMFF94 minimum.
  src_800: assets/img/projects/dokimazo/04_03_torsion_convergence-800.png
- index: 5
  caption: Five solvers racing to the Rosenbrock minimum, same evaluation budget
  topic: solver-visualization
  description: 'Nelder-Mead, CMA-ES (an evolution strategy), a genetic algorithm (PyGAD), and two independent L-BFGS-B implementations (dokimazo''s own native solver and a SciPy reference) searching the same landscape on one shared cumulative-function-evaluation clock -- both gradient-based and heuristic/population-based methods side by side, with a final scoreboard on the figure itself: both L-BFGS-B implementations and Nelder-Mead reach machine precision in 200-240 evaluations; CMA-ES matches them at roughly 10x the budget; the genetic algorithm needs more than double CMA-ES''s budget to get close but not to machine precision.'
  src_800: assets/img/projects/dokimazo/05_05_race_2d_poster-800.png
  video: assets/img/projects/dokimazo/05_05_race_2d_poster.mp4
- index: 6
  caption: The same five solvers on Rastrigin, a highly multimodal landscape
  topic: solver-visualization
  description: 'On a single smooth valley (Rosenbrock, above) most solvers take visibly similar routes. Rastrigin''s many local minima tell a different, genuinely surprising story on this run: both L-BFGS-B implementations and CMA-ES all reach the true global optimum directly, while Nelder-Mead and the genetic algorithm both get trapped in nearby local minima on the same shared budget -- real evidence that gradient methods failing on a multimodal function is a tendency, not a law.'
  src_800: assets/img/projects/dokimazo/06_06_race_rastrigin_poster-800.png
  video: assets/img/projects/dokimazo/06_06_race_rastrigin_poster.mp4
- index: 7
  caption: Search trajectory over a genuine 3-decision-variable problem
  topic: solver-visualization
  description: A literal height-map surface (z = f(x, y)) only exists for exactly 2 inputs and 1 output — for a real 3-variable system there is no single such surface to draw. This is the mathematically honest alternative for "a 3D surface trace for a three-variable system" — every point IPOP-CMA-ES actually evaluated, plotted at its own (x1, x2, x3) coordinate and colored by objective value on a log scale, with the converging search path traced through that 3D decision space rather than mislabeled as a surface it structurally can't be.
  src_800: assets/img/projects/dokimazo/07_07_threevar_trajectory_poster-800.png
  video: assets/img/projects/dokimazo/07_07_threevar_trajectory_poster.mp4
- index: 8
  caption: Sampler coverage — plain random vs. two quasi-Monte-Carlo designs
  topic: solver-visualization
  description: The same number of points drawn by three of dokimazo's registered samplers over an identical 2-D box — plain Monte Carlo (visibly clustered, with real gaps) against Sobol' and Latin-Hypercube quasi-Monte-Carlo designs, whose center-L2 discrepancy (a standard numerical measure of how evenly points fill a space) comes out roughly two orders of magnitude lower at this sample size, matching the visibly more even coverage.
  src_800: assets/img/projects/dokimazo/08_08_sampler_comparison-800.png
- index: 9
  caption: Solution mapping — extracting a Pareto front from a bi-objective sample
  topic: solver-visualization
  description: 300 points sampled from a standard bi-objective test problem (ZDT1), with dokimazo's fast-non-dominated-sort extracting the non-dominated subset (red) from the dominated majority (gray) against the problem's own known true front (gray line). The extracted front sitting above the true one is expected, not an error — ZDT1's true front requires an auxiliary input to be exactly zero, unreachable by plain random sampling — and honestly shows what solution mapping does (extract a front from a given sample) versus what it doesn't (generate a good sample in the first place, a real multi-objective solver's job).
  src_800: assets/img/projects/dokimazo/09_09_pareto_zdt1-800.png
- index: 10
  caption: 'Rosenbrock: watch the search itself, not a spinning camera'
  topic: solver-visualization
  description: 'A real CMA-ES run on the Rosenbrock benchmark, fixed camera: the gold point starts at a poor initial guess and walks, evaluation by evaluation, along the curved valley toward the true minimum. The panel on the right tracks the same run''s best objective value dropping in real time (log scale) as the search converges to essentially zero.'
  src_800: assets/img/projects/dokimazo/10_10_surface_trace_3d_poster-800.png
  video: assets/img/projects/dokimazo/10_10_surface_trace_3d_poster.mp4
- index: 11
  caption: 'Himmelblau: the same search, four equal minima to choose from'
  topic: solver-visualization
  description: The same fixed-camera, path-growth treatment on Himmelblau, which has four separate equal-depth global minima. A real CMA-ES run settles on one of them, its evaluation cloud and best-so-far path revealed as the search progresses, with the live objective value dropping alongside it in the right-hand panel.
  src_800: assets/img/projects/dokimazo/11_11_surface_himmelblau_poster-800.png
  video: assets/img/projects/dokimazo/11_11_surface_himmelblau_poster.mp4
- index: 12
  caption: A fixed-slice projection of the 3-variable trajectory
  topic: solver-visualization
  description: 'Companion static figure to the 3-decision-variable trajectory result: a 2-variable log10(1+f) height-map slice taken at the search''s own found x3, with that run''s (x1, x2) path projected onto it. Point colour is each point''s own true 3D objective value; surface height is the fixed-slice value only — the two are deliberately different quantities, stated as such in the figure''s own title, so the projection is never mistaken for the real 3D landscape.'
  src_800: assets/img/projects/dokimazo/12_12_threevar_surface_slice-800.png
  src_1600: assets/img/projects/dokimazo/12_12_threevar_surface_slice-1600.png
- index: 13
  caption: Forward uncertainty propagation through Rosenbrock
  topic: uncertainty-propagation
  description: Monte Carlo forward propagation (dokimazo.uq.propagation.propagate) of Normal input uncertainty through the Rosenbrock response, with the resulting output distribution's mean and +/-1 standard deviation band annotated directly on the histogram — uncertainty propagation as a plain graph node, not a bespoke analysis script.
  src_800: assets/img/projects/dokimazo/13_13_uq_propagation_histogram-800.png
  src_1600: assets/img/projects/dokimazo/13_13_uq_propagation_histogram-1600.png
- index: 14
  caption: 'The vine mark: "I am the vine, you are the branches" (John 15:5) as a real topology optimization'
  topic: identity-vine-mark
  description: 'dokimazo''s own mark, generated — not drawn — by a real SIMP compliance- minimization topology optimization (dokimazo.physics.topopt): a single trunk support carrying a distributed canopy load, converging under an exact self-adjoint gradient to a genuinely branching structure. Every branch is 100% solver output; only the ink color and typography are a human choice, both stated plainly in docs/IDENTITY.md.'
  src_800: assets/img/projects/dokimazo/14_14_logo_topopt_poster-800.png
  video: assets/img/projects/dokimazo/14_14_logo_topopt_poster.mp4
- index: 15
  caption: The bare vine mark
  topic: identity-vine-mark
  description: The converged material field alone, transparent background — the actual logo asset, unedited from the SIMP solver's own output.
  src_800: assets/img/projects/dokimazo/15_15_vine_mark-800.png
- index: 16
  caption: Gradient descent beats a genetic algorithm and reinforcement learning by ~4x, at equal evaluation budget
  topic: topology-optimization-study
  description: Same SIMP compliance-minimization problem (288 correlated design variables), same ~150-evaluation budget, same exact volume-constraint projection applied to every arm so none fails on worse constraint handling alone. The exact self-adjoint gradient (one extra vector operation, no second linear solve) lets Optimality-Criteria descent reach compliance=143.7; PyGAD's genetic algorithm (593.3, using roughly double the evaluation budget) and a REINFORCE policy over a static Gaussian action (577.1) both structurally cannot use that information.
  src_800: assets/img/projects/dokimazo/16_16_topopt_gradient_vs_heuristics-800.png
- index: 17
  caption: The three arms' resulting material layouts, side by side
  topic: topology-optimization-study
  description: What each method actually converged to at the same evaluation budget — the gradient arm's clean, load-path-following structure next to the GA/RL arms' still-mostly-undifferentiated density fields.
  src_800: assets/img/projects/dokimazo/17_17_topopt_density_fields-800.png
- index: 18
  caption: '"Tested by fire" (1 Peter 1:7): a real constrained combustion optimization'
  topic: identity-refining-fire
  description: 'dokimazo''s second mark — a real reactor temperature trajectory (GRI-Mech 3.0, 36-species kinetics) at the converged optimum of a genuinely constrained optimization run through PANSOPHIA''s own CFDCore.ignition_delay as a third-party connector (dokimazo.objectives.external): minimize ignition delay subject to a 2320 K temperature ceiling — "that the dross be consumed... yet the gold not destroyed." The optimizer converged to T_final=2295.4 K, 24.6 K under the ceiling — a genuinely binding constraint, not a slack one.'
  src_800: assets/img/projects/dokimazo/18_18_refining_fire_poster-800.png
  video: assets/img/projects/dokimazo/18_18_refining_fire_poster.mp4
- index: 19
  caption: Constrained optimization convergence — ignition delay minimized against the temperature ceiling
  topic: identity-refining-fire
  description: 82 real Julia/GRI-Mech-3.0 kinetics evaluations (penalty-continuation over Nelder-Mead, dokimazo.constraints), each one an actual external-process subprocess call — not a surrogate or a cached analytic function.
  src_800: assets/img/projects/dokimazo/19_19_refining_fire_convergence-800.png
- index: 20
  caption: Rocket-nozzle shape optimization through a real third-party quasi-1D Euler CFD solver
  topic: third-party-connector
  description: dokimazo.objectives.external driving PANSOPHIA's own CFDCore.solve_quasi1d_euler as a black-box connector — no dokimazo kernel change to add this physics code, only a driver script on the params.json/result.json contract. 37 real CFD evaluations (Nelder-Mead), nozzle thrust improved from 4.328e6 to 4.367e6 N-equivalent.
  src_800: assets/img/projects/dokimazo/20_20_nozzle_thrust_convergence-800.png
- index: 21
  caption: 'Rectangle to airfoil: a real free-form camber-shape optimization, gradient-driven'
  topic: aircraft-design
  description: 'The jax-native vortex-panel method (dokimazo_aero.panel_method) giving EXACT jax.grad gradients through a real thin-airfoil linear solve, maximizing section lift coefficient over a free-form 2-harmonic camber-line design space (not the fixed NACA (m, p) family). Two segments, honestly distinguished on the video itself: an illustrative opening morphs a literal rectangular block into the optimizer''s own flat-plate starting point (never claimed as solver output); every frame after that is a real per-iteration gradient-ascent step, unedited, ending at a converged cambered shape.'
  src_800: assets/img/projects/dokimazo/21_21_airfoil_optimization_poster-800.png
  video: assets/img/projects/dokimazo/21_21_airfoil_optimization_poster.mp4
